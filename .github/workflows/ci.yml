name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen and SwiftLint
        run: scripts/ci/install-xcodegen-swiftlint.sh

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodegen generate
          # The Icon Composer bundle must be one resource, not a folder group.
          grep -F 'AppIcon.icon in Resources' umbilical.xcodeproj/project.pbxproj
          # MenuBarIcon lives in this catalog. The app icon does not.
          grep -F 'Assets.xcassets in Resources' umbilical.xcodeproj/project.pbxproj
          if grep -F 'icon.json' umbilical.xcodeproj/project.pbxproj; then
            echo "AppIcon.icon was expanded into its files" >&2
            exit 1
          fi

      - name: Install GnuPG
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_ANALYTICS=1
          if ! command -v gpg >/dev/null 2>&1; then
            brew install gnupg
          fi
          gpg --version

      - name: Fetch pinned yt-dlp
        run: scripts/fetch-helpers.sh

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project umbilical.xcodeproj \
            -scheme umbilical \
            -destination 'platform=macOS' \
            -configuration Debug \
            build

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild \
            -project umbilical.xcodeproj \
            -scheme umbilical \
            -destination 'platform=macOS' \
            -configuration Debug \
            test

      - name: Install pkg-config
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_ANALYTICS=1
          brew install pkg-config
          command -v pkg-config

      - name: Build universal aria2c
        run: scripts/build-aria2.sh

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project umbilical.xcodeproj \
            -scheme umbilical \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/release" \
            build

      - name: Sign the Release app ad hoc
        run: |
          set -euo pipefail
          scripts/release/sign-bundle.sh \
            "${RUNNER_TEMP}/release/Build/Products/Release/umbilical.app" \
            - \
            "${GITHUB_WORKSPACE}"

      - name: Reject get-task-allow
        run: |
          set -euo pipefail
          scripts/check-no-get-task-allow.sh \
            "${RUNNER_TEMP}/release/Build/Products/Release/umbilical.app"

      - name: Run signed yt-dlp from the Release app
        run: |
          set -euo pipefail
          scripts/ci/yt-dlp-version.sh \
            "${RUNNER_TEMP}/release/Build/Products/Release/umbilical.app"

      - name: Check the unsigned Release bundle
        run: |
          set -euo pipefail
          python3 scripts/release/release_tools.py check-built-app \
            --app "${RUNNER_TEMP}/release/Build/Products/Release/umbilical.app"

      - name: Confirm Assets.car contains the light and dark AppIcon
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/release/Build/Products/Release/umbilical.app"
          car="${app}/Contents/Resources/Assets.car"
          plist="${app}/Contents/Info.plist"
          test -f "${car}"
          /usr/bin/plutil -p "${plist}"
          /usr/bin/plutil -extract CFBundleIconName raw "${plist}" | grep -x AppIcon
          assetutil --info "${car}" | tee "${RUNNER_TEMP}/assets-car-info.txt"
          grep AppIcon "${RUNNER_TEMP}/assets-car-info.txt"
          grep -F DarkAqua "${RUNNER_TEMP}/assets-car-info.txt"

      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: swift-format
        run: |
          set -euo pipefail
          swift_format="$(xcrun --find swift-format)"
          "${swift_format}" lint --strict --recursive \
            --configuration .swift-format App Extension Tests

  aria2:
    name: aria2c
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pkg-config
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_ANALYTICS=1
          brew install pkg-config
          command -v pkg-config

      - name: Build universal aria2c
        run: scripts/build-aria2.sh

      - name: Test the engine
        run: swift test
        env:
          ARIA2C: ${{ github.workspace }}/helpers/bin/aria2c
          UMB_REQUIRE_ARIA2: "1"

  engine:
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libxml2-dev zlib1g-dev \
            libncurses6 libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libpython3-dev libsqlite3-0 libstdc++-13-dev libz3-dev unzip \
            tcpdump

      - name: Build aria2 without WebSocket
        run: scripts/build-aria2-linux.sh "${RUNNER_TEMP}/aria2"

      - name: Install Swift
        run: |
          set -euo pipefail
          url="https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/swift.tar.gz "$url"
          echo "7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b  /tmp/swift.tar.gz" \
            | sha256sum -c -
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >>"${GITHUB_PATH}"

      - name: Test the engine
        run: swift test
        env:
          ARIA2C: ${{ runner.temp }}/aria2/bin/aria2c
          UMB_REQUIRE_ARIA2: "1"

  aria2-xcode-27:
    name: aria2c Xcode 27
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
          xcrun --find clang
          clang --version

      - name: Install pkg-config
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_ANALYTICS=1
          brew install pkg-config
          command -v pkg-config

      - name: Build universal aria2c
        run: scripts/build-aria2.sh

  release-tools:
    name: Release tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release helpers
        run: |
          set -euo pipefail
          python3 scripts/release/test_release_tools.py
          python3 scripts/check-app-icon-assets.py
