name: umbilical
options:
  bundleIdPrefix: me.peapod
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
targets:
  umbilical:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - umbilical.entitlements
    settings:
      base:
        PRODUCT_NAME: umbilical
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical
        PRODUCT_MODULE_NAME: Umbilical
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: umbilical
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (C) 2026 Karim Smires"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # App Sandbox is off. See docs/PLAN.md section 8. Hardened runtime is on.
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: App/umbilical.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_TESTABILITY: "YES"
  umbilicalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - UmbilicalEngineTests
      - path: App/UmbilicalMarker.swift
      - path: App/EngineStub.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
schemes:
  umbilical:
    build:
      targets:
        umbilical: all
        umbilicalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - umbilicalTests
