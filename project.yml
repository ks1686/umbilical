name: umbilical
options:
  bundleIdPrefix: me.peapod
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
  configs:
    # Debug keeps the injected entitlement so the debugger can attach.
    # Release must not include com.apple.security.get-task-allow.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
packages:
  Umbilical:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  umb-watch:
    type: tool
    platform: macOS
    sources:
      - path: Sources/umb-watch
    settings:
      base:
        PRODUCT_NAME: umb-watch
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.umb-watch
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
  umbilical:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - umbilical.entitlements
          - umbilical-debug.entitlements
          - umbilical-developer-id.entitlements
          - Info.plist
          - Session
          - Session/**
    dependencies:
      - package: Umbilical
        products:
          - UmbilicalUI
          - UmbilicalEngine
      # Xcode embeds this binary framework when the product is linked.
      # An extra embed phase looks up a product file named Sparkle and fails the build.
      - package: Sparkle
        product: Sparkle
      - target: umb-watch
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: umbilicalExtension
        link: false
        embed: true
        codeSign: true
    configFiles:
      Debug: Config/Licensing.xcconfig
      Release: Config/Licensing.xcconfig
    # These scripts run before Xcode signs umbilical.app, so the helpers
    # are signed first. The Xcode 26.6 App log signs the app after them.
    postBuildScripts:
      - path: scripts/copy-bundled-aria2.sh
        name: Copy bundled aria2c
        basedOnDependencyAnalysis: false
        showEnvVars: false
      - path: scripts/copy-bundled-yt-dlp.sh
        name: Copy bundled yt-dlp
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: umbilical
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical
        PRODUCT_MODULE_NAME: Umbilical
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: umbilical
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (C) 2026 Karim Smires"
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1.0.1"
        # App Sandbox is off. See docs/PLAN.md section 8. Hardened runtime is on.
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: App/umbilical.entitlements
        # Compiled from App/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: "YES"
        # Debug may omit aria2c and yt-dlp. Release fails if either is
        # missing. User script sandboxing would skip these copies.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # "-" is an ad hoc signature. The Mac release script passes the Developer ID.
        ARIA2_CODESIGN_IDENTITY: "-"
        YT_DLP_CODESIGN_IDENTITY: "-"
      configs:
        Debug:
          # Ad hoc Sparkle cannot load while library validation is on.
          # Release keeps validation. See docs/RELEASE.md.
          CODE_SIGN_ENTITLEMENTS: App/umbilical-debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/umbilical.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
          ENABLE_TESTABILITY: "NO"
  umbilicalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - UmbilicalEngineTests
          - UmbilicalUITests
      - path: App/UmbilicalMarker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
  umbilicalExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - "**/*.entitlements"
          - Info.plist
    dependencies:
      - package: Umbilical
        products:
          - UmbilicalEngine
    settings:
      base:
        PRODUCT_NAME: umbilicalExtension
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.extension
        PRODUCT_MODULE_NAME: UmbilicalExtension
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Extension/Info.plist
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1.0.1"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    postBuildScripts:
      - path: scripts/stamp-extension-manifest.sh
        name: Stamp extension manifest version
        basedOnDependencyAnalysis: false
        showEnvVars: false
schemes:
  umbilical:
    build:
      targets:
        umbilical: all
        umbilicalTests: [test]
        umb-watch: all
        umbilicalExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - umbilicalTests
