name: umbilical
options:
  bundleIdPrefix: me.peapod
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
packages:
  Umbilical:
    path: .
targets:
  umb-watch:
    type: tool
    platform: macOS
    sources:
      - path: Sources/umb-watch
    settings:
      base:
        PRODUCT_NAME: umb-watch
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.umb-watch
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        SKIP_INSTALL: "YES"
  umbilical:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - umbilical.entitlements
          - Info.plist
          - Session
          - Session/**
    dependencies:
      - package: Umbilical
        products:
          - UmbilicalUI
          - UmbilicalEngine
      - target: umb-watch
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: umbilicalExtension
        link: false
        embed: true
        codeSign: true
    # This script is last among the target phases. The Xcode 26.6 App log
    # signs umbilical.app after it, so aria2c is signed first.
    postBuildScripts:
      - path: scripts/copy-bundled-aria2.sh
        name: Copy bundled aria2c
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_NAME: umbilical
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical
        PRODUCT_MODULE_NAME: Umbilical
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: umbilical
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (C) 2026 Karim Smires"
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # App Sandbox is off. See docs/PLAN.md section 8. Hardened runtime is on.
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: App/umbilical.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_TESTABILITY: "YES"
        # aria2c may be absent when this script runs. User script sandboxing
        # would skip or fail that optional copy.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # M5 sets this to the Developer ID. "-" is an ad hoc signature.
        ARIA2_CODESIGN_IDENTITY: "-"
  umbilicalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - UmbilicalEngineTests
          - UmbilicalUITests
      - path: App/UmbilicalMarker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
  umbilicalExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - "**/*.entitlements"
          - Info.plist
    dependencies:
      - package: Umbilical
        products:
          - UmbilicalEngine
    settings:
      base:
        PRODUCT_NAME: umbilicalExtension
        PRODUCT_BUNDLE_IDENTIFIER: me.peapod.umbilical.extension
        PRODUCT_MODULE_NAME: UmbilicalExtension
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Extension/Info.plist
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  umbilical:
    build:
      targets:
        umbilical: all
        umbilicalTests: [test]
        umb-watch: all
        umbilicalExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - umbilicalTests
